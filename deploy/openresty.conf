# Include in the nginx/OpenResty http context. Supply your real domain and TLS paths.
map $http_upgrade $altasci_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 443 ssl;
    server_name tunnel.example.com;
    ssl_certificate /etc/altasci/tls/fullchain.pem;
    ssl_certificate_key /etc/altasci/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /ws {
        if ($http_upgrade !~* "^websocket$") { return 426; }
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $altasci_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
    location = /agent/v1/ws {
        if ($http_upgrade !~* "^websocket$") { return 426; }
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $altasci_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
