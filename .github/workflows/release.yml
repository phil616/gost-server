name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node scripts/release-metadata.cjs

  build:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish verified tag assets
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: release-assets
      - name: Verify asset checksums before publishing
        working-directory: release-assets
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 2
          for checksum in *.sha256; do sha256sum -c "$checksum"; done
      - name: Create draft, upload complete assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; fi
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            jq -e '.isDraft == true' "$RUNNER_TEMP/release.json" > /dev/null || {
              echo 'Refusing to replace a published release. Create a new version tag.' >&2
              exit 1
            }
          else
            printf '%s\n' \
              'MIT License; copyright (c) 2026 @phil616. Third-party components retain their licenses.' \
              'The distribution ZIP contains Windows amd64 MSI/programs, Linux amd64/arm64 programs, Web UI, documentation, notices and exact MPL dependency sources.' \
              'The source ZIP contains project sources and the modified GOST baseline. Verify the SHA-256 files before use.' \
              'Windows executables/MSI are unsigned. CI tests do not replace MSI installation or server acceptance tests.' > "$RUNNER_TEMP/release-notes.md"
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" \
              --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease="$prerelease"
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.zip release-assets/*.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease" --latest="$([[ "$prerelease" == false ]] && echo true || echo false)"
